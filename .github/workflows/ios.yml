name: Build iOS (unsigned IPA)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & sync web app into iOS project
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Build (no code signing)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Nearly.ipa Payload
          ls -lh Nearly.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Nearly-ipa
          path: Nearly.ipa

      - name: Publish as release "latest-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build -y --cleanup-tag || true
          gh release create latest-build Nearly.ipa \
            --target "$GITHUB_SHA" \
            --title "Nearly – latest build" \
            --notes "Unsigned IPA from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Sideload with AltStore, SideStore or Sideloadly (they sign it with your Apple ID)." \
            --prerelease
